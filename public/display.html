<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sales wins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0e1a45; --ink-2:#18296b; --gold:#f4b73a; --paper:#fbf8f0;
    --coral:#ff6f5e; --teal:#33c6b4; --muted:#9aa6d6;
    font-family:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:var(--ink);color:var(--paper);overflow:hidden}
  canvas{position:fixed;inset:0;pointer-events:none;z-index:3}

  /* Idle screen */
  #idle{position:fixed;inset:0;display:grid;grid-template-rows:1fr auto;padding:5vh 6vw}
  #idle h1{align-self:center;font-weight:600;font-size:clamp(28px,4.4vw,80px);line-height:1.1;max-width:18ch;color:var(--paper)}
  #idle h1 span{display:block;color:var(--muted);font-weight:400;font-size:.45em;margin-top:.6em}
  #board{display:flex;gap:2vw;flex-wrap:wrap;border-top:2px solid var(--ink-2);padding-top:3vh}
  #board .win{min-width:14vw}
  #board .who{font-weight:600;font-size:clamp(16px,1.6vw,30px)}
  #board .what{color:var(--muted);font-size:clamp(12px,1vw,18px);margin-top:.2em}

  /* Celebration */
  #party{position:fixed;inset:0;z-index:2;display:none;place-items:center;text-align:center;padding:4vw;
         background:radial-gradient(circle at 50% 45%, var(--ink-2) 0%, var(--ink) 70%)}
  #party.on{display:grid}
  #bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;display:none}
  #party.has-video #bg{display:block}
  #shade{position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse at center, rgba(5,8,20,.35) 0%, rgba(5,8,20,.15) 60%, rgba(5,8,20,.45) 100%)}

  .card{position:relative;z-index:4;width:min(72vw,1250px);padding:4.5vh 4vw 4vh;border-radius:clamp(16px,2vw,36px);
        background:rgba(12,16,34,.38);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
        border:2px solid rgba(244,183,58,.75);
        box-shadow:0 0 0 1px rgba(255,255,255,.08) inset, 0 0 60px rgba(244,183,58,.35), 0 0 22px rgba(244,183,58,.25) inset}
  .label{font-weight:600;font-size:clamp(12px,1.15vw,22px);letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
  .name{font-weight:800;font-size:clamp(40px,6.2vw,140px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1;letter-spacing:-.02em;margin:.18em 0 .08em;
        background:linear-gradient(180deg,#ffffff 0%,#dfe7ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
        filter:drop-shadow(0 4px 24px rgba(0,0,0,.45))}
  .name.wrap{white-space:normal;overflow:visible;text-wrap:balance;line-height:1.05}
  .amount{font-weight:800;font-size:clamp(34px,5.2vw,104px);line-height:1.05;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.45)}
  .amount:empty{display:none}
  .done{font-weight:600;font-size:clamp(14px,1.5vw,28px);letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.8);margin-top:1.1em}

  #party.on .card{animation:pop .9s cubic-bezier(.2,1.35,.35,1) both}
  #party.on .label{animation:rise .6s .35s both}
  #party.on .name{animation:rise .7s .45s both}
  #party.on .amount{animation:count .8s .7s cubic-bezier(.2,1.5,.35,1) both}
  #party.on .done{animation:rise .6s .9s both}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
  @keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
  @keyframes count{from{transform:scale(1.6);opacity:0}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){#party.on *{animation:none!important}}
  @media (max-width:700px){.card{width:92vw}}

  #hint{position:fixed;right:2vw;bottom:2vh;z-index:4;color:var(--muted);font-size:14px}
  body.celebrating #hint{display:none}
  body.celebrating.sound-blocked #hint{display:block;color:var(--paper)}
  #status{position:fixed;left:2vw;bottom:2vh;z-index:4;font-size:14px;color:var(--coral)}
</style>
</head>
<body>
<section id="idle">
  <h1>The next closed deal shows up here.<span>Every contract signed gets its moment on this screen.</span></h1>
  <div id="board"></div>
</section>

<section id="party" aria-live="assertive">
  <video id="bg" playsinline preload="auto"></video>
  <div id="shade"></div>
  <div class="card">
    <p class="label">Congratulations</p>
    <p class="name" id="pname"></p>
    <p class="amount" id="pamount"></p>
    <p class="done" id="pdeal">Signed a Contract</p>
  </div>
</section>

<canvas id="fx"></canvas>
<div id="hint">Click once to turn on sound · press F for full screen</div>
<div id="status"></div>

<script>
const SHOW_SECONDS = 15;
const queue = []; let showing = false; let audio = null;

const $ = (id) => document.getElementById(id);
const money = (a) => { const n = Number(a); return a && !isNaN(n) ? n.toLocaleString(undefined,{style:"currency",currency:"USD",maximumFractionDigits:Number(a)%1?2:0}) : (a||""); };

function renderBoard(list){
  $("board").innerHTML = list.slice(0,5).map(w => `
    <div class="win"><div class="who"></div><div class="what"></div></div>`).join("");
  [...$("board").children].forEach((el,i)=>{
    const w = list[i];
    el.querySelector(".who").textContent = w.name;
    el.querySelector(".what").textContent = [w.deal, money(w.amount)].filter(Boolean).join(", ")
      || new Date(w.at).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  });
}
let history = [];

/* Shrink a long name until it fits on one line; past half size, let it wrap instead */
function fitName(){
  const el = $("pname");
  el.style.fontSize = ""; el.classList.remove("wrap");
  let size = parseFloat(getComputedStyle(el).fontSize);
  const min = size * .5;
  while (el.scrollWidth > el.clientWidth && size > min) { size -= 2; el.style.fontSize = size + "px"; }
  if (el.scrollWidth > el.clientWidth) el.classList.add("wrap");
}
addEventListener("resize", () => { if (showing) fitName(); });

function next(){
  if (showing || !queue.length) return;
  showing = true;
  const w = queue.shift();
  $("pname").textContent = w.name;
  $("pamount").textContent = money(w.amount);
  $("pdeal").textContent = w.deal ? "Contract completed with " + w.deal : "signed a contract";
  document.body.classList.add("celebrating");
  const p = $("party"); p.classList.remove("on"); void p.offsetWidth; p.classList.add("on");
  fitName();
  let ms = SHOW_SECONDS*1000;
  if (videoReady) {
    const v = $("bg"); p.classList.add("has-video");
    v.currentTime = 0; v.muted = false;
    v.play().catch(() => { v.muted = true; soundBlocked(); v.play().catch(()=>{}); });
    if (isFinite(v.duration) && v.duration > 3) ms = Math.min(v.duration, 60) * 1000;
  } else { p.classList.remove("has-video"); chime(); }
  startMoney(ms);
  setTimeout(()=>{ stopVideo(); p.classList.remove("on"); document.body.classList.remove("celebrating"); showing=false; history.unshift(w); renderBoard(history); next(); }, ms);
}

/* Background video */
let videoReady = false;
function useVideo(src){
  const v = $("bg");
  v.onloadedmetadata = () => { videoReady = true; };
  v.onerror = () => { videoReady = false; };
  v.src = src; v.load();
}
// The video only plays while a celebration is on screen; otherwise it is stopped, rewound and hidden.
function stopVideo(){
  const v = $("bg");
  v.pause(); v.muted = true;
  try { v.currentTime = 0; } catch {}
  $("party").classList.remove("has-video");
}
$("bg").addEventListener("play", () => { if (!showing) stopVideo(); });
// On the self-hosted server, video/congratulations.mp4 is used automatically.
if (location.protocol.startsWith("http")) useVideo("video/congratulations.mp4");

/* Live connection to the server */
let wasConnected = false;
function connect(){
  if (location.protocol === "file:") return;
  let es; try { es = new EventSource("/events"); } catch { return; }
  es.addEventListener("history", e => { history = JSON.parse(e.data); renderBoard(history); });
  es.onmessage = e => { queue.push(JSON.parse(e.data)); next(); };
  es.onopen = () => { wasConnected = true; $("status").textContent = ""; };
  es.onerror = () => { if (wasConnected) $("status").textContent = "Connection to the server lost. Reconnecting…"; else es.close(); };
}
connect();

/* Sound: a short bell arpeggio (browsers need one click first) */
function soundBlocked(){
  document.body.classList.add("sound-blocked");
  $("hint").textContent = "Sound is blocked · click once to turn it on";
}
document.addEventListener("click", () => {
  audio = audio || new AudioContext();
  if (audio.state === "suspended") audio.resume().catch(()=>{});
  document.body.classList.remove("sound-blocked");
  $("hint").textContent = "Sound on · press F for full screen";
  // A celebration that started muted gets its sound back straight away.
  const v = $("bg");
  if (showing && videoReady && v.muted) { v.muted = false; v.play().catch(() => { v.muted = true; soundBlocked(); v.play().catch(()=>{}); }); }
});
function chime(){
  if(!audio) return;
  [523,659,784,1047].forEach((f,i)=>{
    const o=audio.createOscillator(), g=audio.createGain(), t=audio.currentTime+i*.13;
    o.type="triangle"; o.frequency.value=f; g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.3,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+1.2);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t+1.3);
  });
}
document.addEventListener("keydown", e => { if(e.key.toLowerCase()==="f") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); });

/* Money rain */
const cv=$("fx"), cx=cv.getContext("2d"); let bills=[], rainUntil=0, running=false;
function size(){ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; } size(); addEventListener("resize",size);

// $100 note photos (front and back), shown small on screen as they fall.
const noteFront = new Image(), noteBack = new Image(); let noteReady = 0;
noteFront.onload = noteBack.onload = () => noteReady++;

function spawnBill(fromTop){
  const W=cv.width, side=Math.random()<.78;           // most bills fall at the sides, leaving the card clear
  const x = side ? (Math.random()<.5 ? Math.random()*W*.26 : W - Math.random()*W*.26) : Math.random()*W;
  const s=(.22+Math.random()*.18)*devicePixelRatio*Math.max(.6, innerWidth/1600);
  bills.push({x, y: fromTop ? -80*devicePixelRatio : -Math.random()*cv.height,
    vy:(2.6+Math.random()*3)*devicePixelRatio, sway:Math.random()*6.28, swaySp:.02+Math.random()*.03,
    r:Math.random()*6.28, vr:(Math.random()-.5)*.04, flip:Math.random()*6.28, flipSp:.04+Math.random()*.06, s});
}
function startMoney(ms){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  rainUntil = performance.now() + ms - 1500;
  for(let i=0;i<70;i++) spawnBill(false);
  if(!running){ running=true; requestAnimationFrame(tick); }
}
function tick(now){
  cx.clearRect(0,0,cv.width,cv.height);
  if (now < rainUntil && bills.length < 140 && Math.random()<.55) spawnBill(true);
  for(const b of bills){
    b.sway+=b.swaySp; b.flip+=b.flipSp; b.r+=b.vr;
    b.y+=b.vy; b.x+=Math.sin(b.sway)*1.4*devicePixelRatio;
    cx.save(); cx.translate(b.x,b.y); cx.rotate(b.r);
    cx.scale(b.s, b.s*Math.cos(b.flip));               // paper flutter
    cx.globalAlpha=.75+.25*Math.abs(Math.cos(b.flip));
    if (noteReady === 2) cx.drawImage(Math.cos(b.flip) >= 0 ? noteFront : noteBack, -160, -68); cx.restore();
  }
  bills=bills.filter(b=>b.y < cv.height+150*devicePixelRatio);
  if(bills.length || now < rainUntil) requestAnimationFrame(tick);
  else { running=false; cx.clearRect(0,0,cv.width,cv.height); }
}
